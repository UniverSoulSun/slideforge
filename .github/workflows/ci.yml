name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Consistency checks
        run: node scripts/check.mjs

      - name: SRI hashes match what the CDN serves
        run: bash scripts/verify-sri.sh

      - name: Install browser test tools
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund "playwright@$(node -p "require('./package.json').devDependencies.playwright")"
          npx playwright install --with-deps chromium

      - name: Smoke test in a real browser
        run: node tests/smoke.cjs
