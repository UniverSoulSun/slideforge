<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Markdown-to-presentation editor with live preview, PDF export, and native print. Runs entirely in the browser.">
    <title>SlideForge</title>

    <!-- PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#4299e1">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="SlideForge">
    <link rel="apple-touch-icon" href="icons/icon-192.png">

    <!--
      External dependencies. Versions are pinned exactly and mirrored in
      package.json devDependencies so Dependabot can flag CVEs. Every tag
      carries a Subresource Integrity hash; when a version changes, the hash
      must be regenerated from that exact file or the browser blocks it.
    -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.4.15/dist/purify.min.js" integrity="sha384-uUMu9JDY09vBzRf9SPcK2VgUj+W/70J6Soc+Dded5P474ElQ63iv9j5N3DE7Kp3N" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked@18.0.14/lib/marked.umd.js" integrity="sha384-2vpGtuKqJvFlwJqYnf/wUMuzUfhUnYBt9oay0e2yaFcq0Dh6/aEbQ8YAOeKGzlYo" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/jspdf@4.2.1/dist/jspdf.umd.min.js" integrity="sha384-qovJwSBbRDPP5cEjCp8S0UP66wrvnjaa60XMOGzTNanrThcrGfXfnZkvgY8N1KT3" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/html2canvas-pro@2.4.4/dist/html2canvas-pro.min.js" integrity="sha384-p1jiYALFnUMa2gZZSne9+5HrPM/5ByRopgI0w/sKXu8PNCSFPaaZpZyq+mXGToaD" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/mermaid@11.17.2/dist/mermaid.min.js" integrity="sha384-EOXBFmc3gx5mb+vn0vPvvGqACToJD24hhacX5Yx+8NUUQrHIle/Qi5Bg9o3zKwW2" crossorigin="anonymous"></script>

    <!-- Local Styles -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="btn-group">
                <button class="btn active" id="editBtn" title="Edit Markdown" aria-label="Edit Markdown">
                    <i class="fas fa-edit" aria-hidden="true"></i>
                </button>
                <button class="btn" id="previewBtn" title="Preview Slides" aria-label="Preview Slides">
                    <i class="fas fa-eye" aria-hidden="true"></i>
                </button>
            </div>
        </aside>

        <main class="main-content">
            <header class="header">
                <div class="logo">SlideForge</div>
                <div class="header-actions">
                    <button class="btn btn-secondary" id="importBtn">Import</button>
                    <button class="btn btn-primary" id="exportPdfBtn">Export PDF</button>
                    <button class="btn btn-secondary" id="shareBtn">Share</button>
                    <button class="btn btn-secondary" id="printNativeBtn">Print</button>
                    <button class="btn btn-secondary" id="saveBtn">Save</button>
                </div>
            </header>

            <div class="panels-container">
                <div class="editor-panel">
                    <div class="editor-header">Markdown Editor</div>
                    <textarea id="markdownEditor" spellcheck="false" aria-label="Markdown source"></textarea>
                </div>
                <div class="preview-panel">
                    <div class="preview-header">Slide Preview</div>
                    <div id="previewContent" class="preview-content"></div>
                </div>
            </div>
        </main>
    </div>

    <!-- Export PDF Modal -->
    <div id="exportModal" class="modal-overlay" style="display: none;">
        <div class="modal-content" role="dialog" aria-modal="true" aria-labelledby="exportModalTitle">
            <h3 id="exportModalTitle">Export as PDF</h3>
            <p>Enter a file name for your PDF:</p>
            <input type="text" id="fileNameInput" placeholder="e.g., my-presentation.pdf">
            <div class="btn-group">
                <button class="btn btn-primary" id="confirmExportBtn">Export</button>
                <button class="btn btn-secondary" id="cancelExportBtn">Cancel</button>
            </div>
        </div>
    </div>

    <!-- Save Modal -->
    <div id="saveModal" class="modal-overlay" style="display: none;">
        <div class="modal-content" role="dialog" aria-modal="true" aria-labelledby="saveModalTitle">
            <h3 id="saveModalTitle">Save Options</h3>
            <div class="save-options">
                <label>
                    <input type="radio" name="saveType" value="markdown" checked>
                    <span>Save as Markdown (.md)</span>
                </label>
                <label>
                    <input type="radio" name="saveType" value="text">
                    <span>Save as Text (.txt)</span>
                </label>
                <label>
                    <input type="radio" name="saveType" value="html">
                    <span>Save as HTML (.html)</span>
                </label>
            </div>
            <input type="text" id="saveFileNameInput" placeholder="e.g., my-presentation">
            <div class="btn-group">
                <button class="btn btn-primary" id="confirmSaveBtn">Save</button>
                <button class="btn btn-secondary" id="cancelSaveBtn">Cancel</button>
            </div>
        </div>
    </div>

    <!-- Hidden file input for import -->
    <input type="file" id="fileInput" class="file-input" accept=".md,.markdown,.txt,.html">

    <div id="notification" class="notification" role="status" aria-live="polite"></div>

    <!-- Local JavaScript -->
    <script src="script.js"></script>
</body>
</html>
